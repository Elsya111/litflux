.app-header{min-height:76px;padding:12px 24px;background:var(--surface)}

.workspace{padding:20px 20px 0}.page-heading h1{font-size:20px;letter-spacing:.3px}.graph-panel{border:0;border-radius:0;background:transparent}.graph-top{padding:12px 0}.graph-note{padding:12px 0}

.toolbar-button,.panel-toggle,.zoom-tools,select{border-radius:4px}.primary{border-radius:5px}.workflow-picker select{background:transparent}

:root{--node-border:#b7b7af;--icon-tile:#e5e4dc;--edge-neutral:#7c817e;--port:#505a55;--accent:#946523;--focus:#eee3cf}
html[data-theme=dark]{--node-border:#51585d;--icon-tile:#24292d;--edge-neutral:#8e9798;--port:#e5e6e0;--accent:#e9b563;--focus:#433d31}
#canvas .node .shape{stroke:var(--node-border)!important}
#canvas .node.is-selected .shape,#canvas .node.is-current .shape,#canvas .node:focus-visible .shape{stroke:var(--accent)!important}
.node .icon-tile,.selected-symbol{background:var(--icon-tile);fill:var(--icon-tile)}
#canvas .edge{stroke:var(--edge-neutral)}#canvas .edge.role-control{stroke:var(--control)}#canvas .edge.role-failure{stroke:var(--failure)}#canvas .edge.role-loop{stroke:var(--loop)}#canvas .edge.role-effect{stroke:var(--resource-line)}#canvas .edge.role-capability{stroke:var(--provider-line)}#canvas .edge.related{stroke:var(--accent)}
.edge-port{fill:var(--port)}

/* --- Collapsible chrome: header, business map, node details -------------- */
.app{position:relative}
.icon-button{border:1px solid var(--line);border-radius:6px;min-height:34px;min-width:36px;padding:0 8px;font-size:13px;line-height:1;background:var(--surface);color:var(--muted)}
.icon-button:hover:not(:disabled){color:var(--ink);background:var(--soft)}
.app.header-collapsed .app-header{display:none}
.edge-hint{position:absolute;z-index:35;display:flex;align-items:center;justify-content:center}
.edge-hint[hidden]{display:none}
.edge-hint>button{opacity:0;pointer-events:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:12px;box-shadow:0 10px 26px #0003;transition:opacity .16s ease,transform .16s ease,color .16s ease}
.edge-hint:hover>button,.edge-hint:focus-within>button{opacity:1;pointer-events:auto;color:var(--ink)}
.edge-top{top:0;left:0;right:0;height:14px}
.edge-top>button{border-radius:0 0 9px 9px;border-top:0;padding:5px 14px;transform:translateY(-5px)}
.edge-top:hover>button,.edge-top:focus-within>button{transform:none}
.edge-left,.edge-right{top:50%;width:18px;height:136px;transform:translateY(-50%)}
.edge-left{left:0}.edge-right{right:0}
.edge-left>button{writing-mode:vertical-rl;border-left:0;border-radius:0 9px 9px 0;padding:14px 4px;transform:translateX(-6px)}
.edge-right>button{writing-mode:vertical-rl;border-right:0;border-radius:9px 0 0 9px;padding:14px 4px;transform:translateX(6px)}
.edge-left:hover>button,.edge-left:focus-within>button,.edge-right:hover>button,.edge-right:focus-within>button{transform:none}

/* --- Branch chips in node details --------------------------------------- */
.branch-choices{display:flex;flex-wrap:wrap;gap:6px}
.branch-chip{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12px;background:var(--surface);color:var(--muted)}
.branch-chip[aria-pressed=true]{background:var(--focus);border-color:var(--tree-line);color:var(--accent)}
.branch-hint{margin:9px 0 0;font-size:11px;color:var(--muted)}
.selected-symbol{color:var(--accent)}
.selected-symbol .role-icon,.selected-symbol .resource-icon{width:24px;height:24px}

/* --- Compact workspace bar: one row instead of heading + context + toolbar */
.workspace-bar{display:flex;align-items:center;gap:14px;margin:2px 2px 8px;min-height:40px}
.workspace-bar h1{font-size:20px;font-weight:600;letter-spacing:.3px;margin:0;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flow-count{font-size:11.5px;color:var(--muted);white-space:nowrap}
.bar-actions{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.bar-actions .primary{min-height:32px}
.read-status{padding:0 2px 8px}

/* Collapsing the top hides the app header, breadcrumbs and the bar together. */
.app.header-collapsed .app-header,
.app.header-collapsed .workspace-bar,
.app.header-collapsed .crumbs,
.app.header-collapsed .read-status{display:none}

/* --- Vertical collapse tabs, centred on each panel edge ------------------ */
:where(.business-panel,.inspector){position:relative}
.edge-toggle{position:absolute;top:50%;transform:translateY(-50%);z-index:6;width:16px;height:62px;display:flex;align-items:center;justify-content:center;padding:0;font-size:12px;line-height:1;border:1px solid var(--line);background:var(--surface);color:var(--muted);opacity:.6;transition:opacity .15s ease,color .15s ease,background .15s ease}
.edge-toggle:hover,.edge-toggle:focus-visible{opacity:1;color:var(--ink);background:var(--soft)}
.edge-toggle-right{right:0;border-right:0;border-radius:8px 0 0 8px}
.edge-toggle-left{left:0;border-left:0;border-radius:0 8px 8px 0}
.node .role-glyph-dot{fill:var(--accent);stroke:none}
.selected-symbol .role-glyph-dot{fill:currentColor;stroke:none}

/* --- Back to parent level ------------------------------------------------ */
.back-level{flex:none;white-space:nowrap}

/* --- Fullscreen source drawer -------------------------------------------- */
#toggle-source-full{margin-left:8px}
.drawer.source-full{position:fixed;inset:18px;z-index:90;flex:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 0 0 100vmax rgba(0,0,0,.55),0 26px 70px #0009}
.drawer.source-full .drawer-head{padding:14px 22px}
.drawer.source-full .drawer-head h2{margin-top:14px}
.drawer.source-full .drawer-body{width:100%;max-width:1080px;margin:0 auto;padding:0 22px 32px}

</div>

<script>// LitFlux drawing primitives: place, measure, draw. This file never decides layout,
// line style or object roles — the project module passes everything in.
const LitFluxDrawing = (() => {
  const NS = 'http://www.w3.org/2000/svg';
  const FONT = '"Segoe UI","PingFang SC","Microsoft YaHei UI",system-ui,sans-serif';
  const LINE = { 15: 21, 14: 19 };
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const cache = new Map();
  const resourceKinds = Object.freeze({database:'数据库',config:'运行配置',directory:'目录',file:'文件',memory:'共享状态',generic:'通用资源'});
  const resourceKind = kind => Object.hasOwn(resourceKinds,kind) ? kind : 'generic';
  function resourceIcon(kind) {
    kind=resourceKind(kind);
    const icon=el('svg',{viewBox:'0 0 24 24',width:24,height:24,fill:'none',stroke:'currentColor','stroke-width':1.5,'stroke-linecap':'round','stroke-linejoin':'round','aria-hidden':'true',class:'resource-icon','data-resource-icon':kind});
    const paths={
      database:'M4 6C4 2 20 2 20 6C20 10 4 10 4 6V18C4 22 20 22 20 18V6 M4 12C4 16 20 16 20 12',
      directory:'M3 7V5H9L12 8H21V20H3Z M3 8H12',
      file:'M6 2H14L20 8V22H6Z M14 2V8H20 M9 13H17 M9 17H15',
      memory:'M3 6L12 2L21 6L12 10Z M3 11L12 15L21 11 M3 16L12 20L21 16',
      generic:'M3 7L12 3L21 7V17L12 21L3 17Z M3 7L12 11L21 7 M12 11V21'
    };
    if(kind==='config'){
      const points=Array.from({length:32},(_,i)=>{const angle=i*Math.PI/16-Math.PI/2,r=i%4<2?10:8;return `${12+r*Math.cos(angle)},${12+r*Math.sin(angle)}`;});
      icon.append(el('polygon',{points:points.join(' ')}),el('circle',{cx:12,cy:12,r:3}));
    }else icon.append(el('path',{d:paths[kind]}));
    return icon;
  }

  const roleGlyphs = {
    business: 'M5 6.5 11 12l-6 5.5 M13 6.5 19 12l-6 5.5',
    decision: 'M8.4 9.6a3.6 3.6 0 1 1 6.1 2.7c-1.3 1-2 1.6-2 3.1',
    component: 'M7.5 7.5h9v9h-9Z M10 3v4.5 M14 3v4.5 M10 16.5V21 M14 16.5V21 M3 10h4.5 M3 14h4.5 M16.5 10H21 M16.5 14H21',
    boundary: 'M4 4.5h16v15H4Z M8 12h7 M12.5 9l3 3-3 3',
  };
  function roleIcon(type) {
    const shape = Object.hasOwn(roleGlyphs, type) ? type : 'business';
    const icon = el('svg', {
      viewBox: '0 0 24 24', width: 24, height: 24, fill: 'none', stroke: 'currentColor',
      'stroke-width': 1.5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round',
      'aria-hidden': 'true', class: 'role-icon', 'data-role-icon': shape,
    });
    icon.append(el('path', { class: 'role-glyph', d: roleGlyphs[shape] }));
    if (shape === 'decision') icon.append(el('circle', { class: 'role-glyph-dot', cx: 12.4, cy: 18.9, r: 1.3, fill: 'currentColor' }));
    return icon;
  }

  function el(tag, attrs = {}) {
    const node = document.createElementNS(NS, tag);
    for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
    return node;
  }
  function width(text, fontSize) {
    ctx.font = `${fontSize}px ${FONT}`;
    return ctx.measureText(String(text)).width;
  }
  function wrap(text, maxWidth, fontSize = 15) {
    const key = `${fontSize}|${maxWidth}|${text}`;
    if (cache.has(key)) return cache.get(key);
    const lines = [];
    for (const paragraph of String(text ?? '').split('\n')) {
      let line = '';
      for (const token of paragraph.match(/[A-Za-z0-9_./:#-]+|\s+|[^\x00-\xff]|./g) || []) {
        if (!line && !token.trim()) continue;
        if (width(line + token, fontSize) <= maxWidth) { line += token; continue; }
        if (line.trim()) lines.push(line.trim());
        line = '';
        if (width(token, fontSize) <= maxWidth) { if (token.trim()) line = token; continue; }
        for (const ch of token) {
          if (line && width(line + ch, fontSize) > maxWidth) { lines.push(line.trim()); line = ''; }
          line += ch;
        }
      }
      if (line.trim()) lines.push(line.trim());
    }
    if (!lines.length) lines.push('');
    const lineHeight = LINE[fontSize] || Math.round(fontSize * 1.4);
    const result = {
      lines,
      lineHeight,
      width: Math.ceil(Math.max(...lines.map((row) => width(row, fontSize)))),
      height: lines.length * lineHeight,
    };
    cache.set(key, result);
    return result;
  }
  function measure(text, options = {}) {
    const result = wrap(text, options.maxWidth ?? 260, options.fontSize ?? 14);
    return { ...result, lines: [...result.lines],
      boxWidth: result.width + 10, boxHeight: result.height + 6 };
  }

  const SIDES = { left: [-1, 0], right: [1, 0], top: [0, -1], bottom: [0, 1] };
  function inside(pos, toward, side) {
    let dx = toward[0] - pos.x, dy = toward[1] - pos.y;
    if (side) {
      const direction = SIDES[side];
      if (!direction) throw Error(`${pos.id}: sides must be left/right/top/bottom`);
      [dx, dy] = direction;
    }
    if (!dx && !dy) throw Error(`${pos.id}: coincident endpoints need an explicit side`);
    const hw = pos.width / 2, hh = pos.height / 2;
    let k;
    k = Math.min(dx ? Math.abs(hw / dx) : Infinity, dy ? Math.abs(hh / dy) : Infinity);
    return [pos.x + dx * k, pos.y + dy * k];
  }
  function rounded(points) {
    let d = `M${points[0][0]} ${points[0][1]}`;
    for (let i = 1; i < points.length - 1; i++) {
      const a = points[i - 1], b = points[i], c = points[i + 1];
      const u = Math.hypot(b[0] - a[0], b[1] - a[1]), v = Math.hypot(c[0] - b[0], c[1] - b[1]);
      const r = Math.min(10, u / 2, v / 2);
      if (!u || !v) continue;
      d += ` L${b[0] + (a[0] - b[0]) * r / u} ${b[1] + (a[1] - b[1]) * r / u}`;
      d += ` Q${b[0]} ${b[1]} ${b[0] + (c[0] - b[0]) * r / v} ${b[1] + (c[1] - b[1]) * r / v}`;
    }
    return d + ` L${points.at(-1)[0]} ${points.at(-1)[1]}`;
  }

  function create(flow, host, handlers = {}) {
    const objectById = new Map(flow.objects.map((o) => [o.id, o]));
    const relationById = new Map(flow.relations.map((r) => [r.id, r]));
    const out = el('svg', { role: 'img', 'aria-label': '当前业务的完整内部流程图' });
    const defs = el('defs');
    const style = el('style');
    style.textContent = [
      '.node .shape{fill:var(--process,#edf4ea);stroke:#91aa9c;stroke-width:1.3}',
      '.node.role-data .shape{fill:var(--data,#edf4f8);stroke:#88a4bb}',
      '.node.role-resource .shape{fill:var(--resource,#e8f1e9);stroke:#558c7a}',
      '.node.role-component .shape{fill:var(--provider,#eeeaf5);stroke:#6d86a9}',
      '.node.role-decision .shape{fill:var(--decision,#f3edf7);stroke:#aa95bd}',
      '.node.role-boundary .shape{fill:var(--soft,#eef1ed);stroke:#9aa8aa;stroke-dasharray:3 3}',
      '.node .n-title{fill:var(--ink,#263b34)}',
      '.node .resource-icon{color:var(--resource-line,#558c7a);pointer-events:none}',
      '.node .detail-hint{fill:var(--accent,#32674e);pointer-events:none}',
      '.node{cursor:pointer}',
      '.node.is-selected .shape{stroke:var(--accent,#32674e);stroke-width:2}',
      '.node.is-current .shape{stroke:var(--accent,#32674e);stroke-width:2.5}',
      '.node.is-done .shape{stroke:var(--accent,#32674e)}',
      '.node.is-dim{opacity:.45}',
      '.edge{fill:none;stroke:var(--accent,#32674e);stroke-width:1.5}',
      '.edge.deferred{stroke-dasharray:5 5}',
      '.edge.role-control{stroke:var(--control,#896e32)}',
      '.edge.role-failure{stroke:var(--failure,#a45d65);stroke-dasharray:2 3}',
      '.edge.role-loop{stroke:var(--loop,#7f6ca1);stroke-dasharray:2 5}',
      '.edge.role-effect{stroke:var(--resource-line,#558c7a)}',
      '.edge.role-capability{stroke:var(--provider-line,#6d86a9);stroke-dasharray:1 4}',
      '.edge.related{stroke-width:2.2}',
      '.edge-hit{fill:none;stroke:transparent;stroke-width:12;cursor:pointer}',
      '.edge-hit:focus-visible{stroke:var(--accent);stroke-opacity:.25;outline:none}',
      '.edge.is-dim{opacity:.3}',
      '.relation-note{cursor:pointer}',
      '.relation-note .note-hit{fill:var(--surface,#fffefa);opacity:.97}',
      '.relation-note .note-title{fill:var(--ink,#263b34)}',
      '.relation-note[data-role=control] .note-title{fill:var(--control,#896e32)}',
      '.relation-note[data-role=loop] .note-title{fill:var(--loop,#7f6ca1)}',
      '.relation-note:hover .note-title,.relation-note.is-selected .note-title{fill:var(--accent,#32674e)}',
      '.relation-note.is-selected .note-hit{stroke:var(--line,#dce3dc);stroke-width:.8}',
      '.control-mark{fill:var(--surface,#fffefa);stroke:var(--control,#896e32);stroke-width:1.2}',
      '.flow-particles{pointer-events:none}',
      '.flow-dot{fill:var(--input,#3e719b);stroke:var(--surface,#fffefa);stroke-width:.8}',
      '.flow-dot[data-direction=output]{fill:var(--output,#9a6746)}',
    ].join('\n');
    for (const role of ['data', 'control', 'failure', 'loop', 'effect', 'capability']) {
      const marker = el('marker', {
        id: `arrow-${role}`, markerWidth: 9, markerHeight: 9,
        refX: 8, refY: 4.5, orient: 'auto', markerUnits: 'userSpaceOnUse',
      });
      marker.append(el('path', {
        d: role === 'loop' ? 'M1 1 L8 4.5 L1 8' : 'M0 0 L9 4.5 L0 9 Z',
        fill: role === 'loop' ? 'none' : 'context-stroke',
        stroke: role === 'loop' ? 'context-stroke' : 'none',
        'stroke-width': 1.5,
      }));
      defs.append(marker);
    }
    defs.append(style);
    const content = el('g');
    const edgeLayer = el('g', { class: 'edges' });
    const noteLayer = el('g', { class: 'notes' });
    const nodeLayer = el('g', { class: 'nodes' });
    content.append(edgeLayer, noteLayer, nodeLayer);
    out.append(defs, content);
    host.replaceChildren(out);

    const positions = new Map(), drawn = new Map(), boxes = [], notes = [], polylines = [];
    let explicit = null;

    const finite = (values, where) => {
      if (values.some((v) => typeof v !== 'number' || !Number.isFinite(v))) {
        throw Error(`${where}: coordinates must be finite numbers`);
      }
    };
    const activate = (group, run) => {
      group.setAttribute('tabindex', '0');
      group.setAttribute('role', 'button');
      group.onclick = run;
      group.onkeydown = (event) => {
        if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); run(); }
      };
    };
    function shape(object) { return el('rect', {class:'shape'}); }
    function sizeOf(object, options) {
      const data=object.type==='data', extra=data?46:76;
      const box=options.width??Math.max(data?124:180,Math.min(280,width(object.title||'',15)+extra));
      const textWidth=Math.max(1,box-(data?40:66));
      const rows=wrap(object.title||'',textWidth,15);
      return {width:box,height:options.height??Math.max(data?48:78,rows.height+30),text:textWidth};
    }

    const scene = {
      svg: out, positions, drawn, boxes, notes, polylines, measure,
      nodeBox(id) {
        const p = positions.get(id);
        if (!p) throw Error(`${id}: place the node before calling nodeBox()`);
        const {x,y,width,height} = p;
        return Object.freeze({x,y,width,height,left:x-width/2,right:x+width/2,top:y-height/2,bottom:y+height/2});
      },
      node(id, x, y, options = {}) {
        const object = objectById.get(id);
        if (!object) throw Error(`Unknown object: ${id}`);
        if (positions.has(id)) throw Error(`Duplicate object: ${id}`);
        finite([x, y], id);
        const size = sizeOf(object, options);
        finite([size.width, size.height], id);
        if (size.width <= 0 || size.height <= 0) throw Error(`${id}: width and height must be positive`);
        const group = el('g', {
          class: `node role-${object.type}`, transform: `translate(${x},${y})`,
          'data-node': id, 'data-role': object.type, 'aria-label': object.title,
        });
        const node = shape(object);
        const w=size.width/2,h=size.height/2,data=object.type==='data';
        for(const [key,value] of Object.entries({x:-w,y:-h,width:size.width,height:size.height,rx:data?h:12}))node.setAttribute(key,value);
        group.append(node);
        if(data)group.append(el('circle',{class:'data-dot',cx:-w+20,cy:0,r:3.5}));
        else{
          group.append(el('rect',{class:'icon-tile',x:-w+12,y:-21,width:38,height:42,rx:8}));
          if(object.type==='resource'){
            group.dataset.resourceKind=resourceKind(object.resourceKind);
            const icon=resourceIcon(object.resourceKind);icon.setAttribute('x',-w+19);icon.setAttribute('y',-12);group.append(icon);
          }else{
            const icon=roleIcon(object.type);icon.setAttribute('x',-w+19);icon.setAttribute('y',-12);group.append(icon);
          }
        }
        if(object.detail){
          group.append(el('path',{class:'detail-hint',d:`M${size.width/2-15} ${size.height/2-18} l5 4 -5 4 Z`,'aria-hidden':'true'}));
        }
        const rows = wrap(object.title || '', size.text, 15);
        const text = el('text', {
          x: object.type==='data'?8:22, y: -(rows.height - rows.lineHeight) / 2, 'text-anchor': 'middle',
          class: 'n-title', 'font-size': 15, 'font-family': FONT,
        });
        rows.lines.forEach((row, index) => {
          const span = el('tspan', { x: object.type==='data'?8:22, dy: index ? rows.lineHeight : 0 });
          span.textContent = row;
          text.append(span);
        });
        group.append(text);
        activate(group, () => handlers.onObject?.(object, false));
        group.ondblclick = () => handlers.onObject?.(object, true);
        group.onpointerenter = event => { if(event.pointerType!=='touch')handlers.onPreview?.(object,group); };
        group.onpointerleave = () => handlers.onPreviewEnd?.();
        group.addEventListener('focus', () => handlers.onPreview?.(object,group,true));
        group.addEventListener('blur', () => handlers.onPreviewEnd?.());
        nodeLayer.append(group);
        const textBox=text.getBBox();
        text.setAttribute('y', Number(text.getAttribute('y'))-textBox.y-textBox.height/2);
        const record = {
          id, type: object.type, x, y, width: size.width, height: size.height,
          group, textWidth: rows.width, textHeight: rows.height,
        };
        positions.set(id, record);
        boxes.push(record);
        return scene;
      },
      edge(id, options = {}) {
        const relation = relationById.get(id);
        if (!relation) throw Error(`Unknown relation: ${id}`);
        if (drawn.has(id)) throw Error(`Duplicate relation: ${id}`);
        const from = positions.get(relation.from), to = positions.get(relation.to);
        if (!from || !to) throw Error(`${id}: place both endpoints before drawing the relation`);
        const sides = options.sides;
        if (!Array.isArray(sides) || sides.length !== 2) throw Error(`${id}: provide sides:[fromSide,toSide]`);
        const via = options.via || [];
        for (const point of via) {
          if (!Array.isArray(point) || point.length !== 2) throw Error(`${id}: via must be [x,y] points`);
          finite(point, id);
        }
        const hasNote = !!relation.label?.trim();
        if (hasNote && (!Array.isArray(options.noteAt) || options.noteAt.length !== 2)) {

          inside(to, via.at(-1) || [from.x, from.y], sides[1]),

          class: `edge role-${relation.type}${relation.type === 'data' ? ' ' + relation.timing : ''}`,

      size(w, h) {

      },
      finish() {

          ...flow.objects.filter((o) => !positions.has(o.id)).map((o) => `object ${o.id}`),

        out.setAttribute('height', canvasHeight);

          svg: out,
          width: canvasWidth,
          height: canvasHeight,
          positions,
          drawn,
          geometry: {
            offset: {x:dx,y:dy},
            width: canvasWidth,
            height: canvasHeight,
            nodes: boxes.map((b) => ({
              id: b.id, kind:'node', role: b.type, x: b.x + dx, y: b.y + dy,
              width: b.width, height: b.height, textWidth: b.textWidth, textHeight: b.textHeight,

              width: n.width, height: n.height,
            })),

function choices(){
  if(!viewChoices.has(current))viewChoices.set(current,Object.fromEntries(flow().objects.filter(o=>o.choices).map(o=>[o.id,o.choices[0].id])));

function whenMatches(when,values){

<script>// Declaration checks plus objective geometry checks. Nothing here judges meaning or taste.
(() => {
  const round = (value) => Math.round(value * 10) / 10;
  const boxOverlap = (a, b) => {
    const w = Math.min(a.x + a.width / 2, b.x + b.width / 2) - Math.max(a.x - a.width / 2, b.x - b.width / 2);
    const h = Math.min(a.y + a.height / 2, b.y + b.height / 2) - Math.max(a.y - a.height / 2, b.y - b.height / 2);
    return w > 0 && h > 0 ? Math.min(w, h) : 0;
  };
  const insideBox = (point, box, pad = 0) => Math.abs(point[0] - box.x) < box.width / 2 - pad && Math.abs(point[1] - box.y) < box.height / 2 - pad;
  function segmentHitsBox(a, b, box, pad = 2) {
    const steps = Math.max(2, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / 4));
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      if (insideBox([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t], box, pad)) return true;
    }
    return false;
  }
  function pointToSegment(point, a, b) {
    const dx = b[0] - a[0], dy = b[1] - a[1];
    const length = dx * dx + dy * dy;
    const t = length ? Math.max(0, Math.min(1, ((point[0] - a[0]) * dx + (point[1] - a[1]) * dy) / length)) : 0;
    return Math.hypot(point[0] - (a[0] + dx * t), point[1] - (a[1] + dy * t));
  }
  function pointToPolyline(point, points) {
    let best = Infinity;
    for (let i = 1; i < points.length; i++) best = Math.min(best, pointToSegment(point, points[i - 1], points[i]));
    return best;
  }

  function geometryWarnings(diagram, flow) {
    if (!diagram?.geometry) return [{ code: 'G0', ids: [], detail: '没有几何数据：drawing 可能未完成' }];
    const warnings = [];
    const { nodes, notes, edges, width, height } = diagram.geometry;
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const overlap = boxOverlap(nodes[i], nodes[j]);
        if (overlap > 0) warnings.push({ code: 'G1', ids: [nodes[i].id, nodes[j].id], detail: `节点重叠 ${round(overlap)}px` });
      }
    }
    for (const box of nodes) {
      if (box.x - box.width / 2 < 8 || box.y - box.height / 2 < 8 || box.x + box.width / 2 > width - 8 || box.y + box.height / 2 > height - 8) {
        warnings.push({ code: 'G2', ids: [box.id], detail: '节点越出画布' });
      }
    }
    for (const note of notes) {
      if (note.x - note.width / 2 < 8 || note.y - note.height / 2 < 8 || note.x + note.width / 2 > width - 8 || note.y + note.height / 2 > height - 8) {
        warnings.push({ code: 'G2', ids: [note.id], detail: '边注越出画布' });
      }
      for (const box of nodes) {
        if (boxOverlap(note, box) > 0) warnings.push({ code: 'G3', ids: [note.id, box.id], detail: '边注压在节点上' });
      }
      for (const other of notes) {
        if (other.id !== note.id && boxOverlap(note, other) > 0) warnings.push({ code: 'G4', ids: [note.id, other.id], detail: '边注互相重叠' });
      }
    }
    for (const edge of edges) {
      const note = notes.find((item) => item.id === edge.id);
      if (note) {
        const distance = pointToPolyline([note.x, note.y], edge.points);
        if (distance > 40) warnings.push({ code: 'G5', ids: [edge.id], detail: `边注离所属边 ${Math.round(distance)}px` });
      }
      const source = flow.relations.find((relation) => relation.id === edge.id);
      for (const box of nodes) {
        if (box.id === source?.from || box.id === source?.to) continue;
        for (let i = 1; i < edge.points.length; i++) {
          if (segmentHitsBox(edge.points[i - 1], edge.points[i], box, 2)) {
            warnings.push({ code: 'G6', ids: [edge.id, box.id], detail: '连线穿过其他对象' });
            break;
          }
        }
      }
    }
    // Fitting depends on the reviewer's window, so it is reported, never scored.
    const host = document.querySelector('#canvas');
    if (host) {
      const fit = Math.min(1, (host.clientWidth - 32) / width, (host.clientHeight - 32) / height);
      warnings.push({ code: 'I1', ids: [], detail: `全图适配约 ${Math.round(fit * 100)}%，正文按 100% 阅读`, info: true });
    }
    const ratio = width / Math.max(1, height);
    if (ratio > 4 || ratio < 0.25) warnings.push({ code: 'G8', ids: [], detail: `画布纵横比 ${round(ratio)}:1；可按阅读需要考虑折返`, info:true });
    for (const box of nodes) {
      const inside=(x,y)=>{
        const w=box.width/2-2,h=box.height/2-2;
        return Math.abs(x)<=w&&Math.abs(y)<=h;
      };
      if ((box.textBoxes||[]).some(r=>[[r.x,r.y],[r.x+r.width,r.y],[r.x,r.y+r.height],[r.x+r.width,r.y+r.height]].some(([x,y])=>!inside(x,y)))) {
        warnings.push({ code: 'G9', ids: [box.id], detail: '文字超出形状' });
      }
      if(box.iconBox){
        const icon=box.iconBox;
        if(!inside(icon.x,icon.y)||!inside(icon.x+icon.width,icon.y+icon.height))warnings.push({code:'G9',ids:[box.id],detail:'资源图标超出形状'});
        if((box.textBoxes||[]).some(t=>t.x<icon.x+icon.width+4&&t.x+t.width>icon.x&&t.y<icon.y+icon.height&&t.y+t.height>icon.y))warnings.push({code:'G9',ids:[box.id],detail:'文字与资源图标重叠'});
      }
    }
    const offset=diagram.geometry.offset||{x:0,y:0};
    for(const warning of warnings){
      warning.coordinateSpace='author';
      warning.boxes=[...nodes,...notes].filter(b=>warning.ids.includes(b.id)).map(b=>({...b,x:b.x-offset.x,y:b.y-offset.y}));
      const note=notes.find(n=>n.id===warning.ids[0]),edge=edges.find(e=>e.id===note?.id);
      if(!note||!edge||!['G2','G3','G4','G5'].includes(warning.code))continue;
      const candidates=edge.points.map(([x,y])=>({x,y,width:note.width,height:note.height})).filter(b=>
        b.x-b.width/2>=8&&b.y-b.height/2>=8&&b.x+b.width/2<=width-8&&b.y+b.height/2<=height-8&&
        !nodes.some(n=>boxOverlap(b,n)>0)&&!notes.some(n=>n.id!==note.id&&boxOverlap(b,n)>0));
      candidates.sort((a,b)=>Math.hypot(a.x-note.x,a.y-note.y)-Math.hypot(b.x-note.x,b.y-note.y));
      warning.suggestion=candidates.length?{noteAt:[round(candidates[0].x-offset.x),round(candidates[0].y-offset.y)],reason:'同一实际路径上的局部可放位置；供作者选择'}:{noteAt:null,reason:'当前路径未找到足够空间，可调整走线、位置或 noteWidth'};
      const nearest=[...edge.points].sort((a,b)=>Math.hypot(a[0]-note.x,a[1]-note.y)-Math.hypot(b[0]-note.x,b[1]-note.y))[0];
      warning.nearestPathPoint=nearest.map((v,i)=>round(v-(i?offset.y:offset.x)));
    }
    const seen = new Set();
    return warnings.filter((warning) => {
      const key = warning.code + warning.ids.join(',');
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });
  }

  function declarationFailures(flow) {
    const failures = [];
    const objects = [...document.querySelectorAll('#canvas [data-node]')];
    const relations = [...document.querySelectorAll('#canvas [data-relation]')];
    if (objects.length !== flow.objects.length) failures.push(`对象数量不符：绘制 ${objects.length}，声明 ${flow.objects.length}`);
    if (relations.length !== flow.relations.length) failures.push(`关系数量不符：绘制 ${relations.length}，声明 ${flow.relations.length}`);
    for (const object of flow.objects) {
      const node = objects.find((item) => item.dataset.node === object.id);
      if (!node) { failures.push(`缺少对象 ${object.id}`); continue; }
      if (node.dataset.role !== object.type) failures.push(`对象 ${object.id} 的角色与声明不符`);
      if(object.type==='resource'&&node.dataset.resourceKind!==LitFluxDrawing.resourceKind(object.resourceKind))failures.push(`资源 ${object.id} 的图标与声明不符`);
    }
    for (const relation of flow.relations) {
      const drawn = currentDiagram?.drawn.get(relation.id);
      if (!drawn) { failures.push(`缺少关系 ${relation.id}`); continue; }
      const text = drawn.group.querySelector('.note-title')?.textContent.replace(/\s/g, '') || '';
      if (text !== (relation.label || '').replace(/\s/g, '')) failures.push(`关系 ${relation.id} 的边注被截断或改写`);
      const classes = drawn.line.classList;
      if (relation.type === 'data') {
        const expected = relation.timing;
        if (!classes.contains(expected)) failures.push(`关系 ${relation.id} 的线型与声明 ${expected} 不一致`);
        if (classes.contains(expected === 'immediate' ? 'deferred' : 'immediate')) failures.push(`关系 ${relation.id} 同时带有两种线型`);
      } else if (classes.contains('immediate') || classes.contains('deferred')) {
        failures.push(`关系 ${relation.id} 是非数据关系，却带了实虚语义`);
      }
    }
    return failures;
  }

  let job = null;
  const pause = async () => { await document.fonts.ready; await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve))); };

  function scenarios(flow,limit=32){
    const owners=flow.objects.filter(o=>o.choices),total=owners.reduce((n,o)=>n*o.choices.length,1),values=[];
    function visit(i,state){if(values.length>=limit)return;if(i===owners.length){values.push(state);return;}for(const c of owners[i].choices)visit(i+1,{...state,[owners[i].id]:c.id});}
    visit(0,{});return {values,total,complete:values.length===total};
  }

  async function run({geometryOnly=false}={}) {
    const clock=performance.now();
    const result = { status: 'running', mode:geometryOnly?'geometry-only':'full', revision: payload.revision, views: [], failures: [], geometry: { warnings: [], diagnostics:[] }, checks: {navigation:'not-run',reading:'not-run',sources:'not-run'}, timingsMs:{} };
    const started = current;
    const seenFlows = new Set();
    for (const [key, view] of businesses) {
      if (!view.flow || seenFlows.has(view.flow)) continue;
      seenFlows.add(view.flow);
      navigate(key);
      await pause();
      if (currentDiagram?.error) { result.failures.push(`${view.title}：绘图错误 ${currentDiagram.error}`); continue; }
      const failures = declarationFailures(view.flow);
      const all = geometryWarnings(currentDiagram, view.flow);
      const warnings = all.filter((warning) => !warning.info);
      result.views.push({ key, title: view.title, failures, warnings, info: all.filter((warning) => warning.info) });
      result.failures.push(...failures.map((message) => `${view.title}：${message}`));
      result.geometry.warnings.push(...warnings.map((warning) => `${view.title}：${warning.code} ${warning.detail} ${warning.ids.join('/')}`));
      result.geometry.diagnostics.push(...all.map(w=>({view:key,...w})));
      result.geometry.info = (result.geometry.info || []).concat(
        all.filter((warning) => warning.info).map((warning) => `${view.title}：${warning.detail}`));
    }
    result.timingsMs.geometry=round(performance.now()-clock);
    result.viewport={width:document.querySelector('#canvas').clientWidth,height:document.querySelector('#canvas').clientHeight};
    if(geometryOnly){navigate(started);result.status=result.failures.length?'failed':'passed';result.geometry.status=result.geometry.warnings.length?'warnings':'passed';return result;}
    // Navigation: enter a nested business and come back.
    const nested = [...businesses.values()].find((view) => view.flow
      && [...businesses.values()].some((child) => child.parent === view.key && child.flow));
    if (nested) {
      navigate(nested.key);
      const before = current;
      const child = [...businesses.values()].find((view) => view.parent === before && view.flow);
      navigate(child.key);
      const entered = current === child.key;
      navigate(before);
      result.checks.navigation = { entered, returned: current === before, from: before, child: child?.key };
      if (!(entered && current === before)) result.failures.push('进入子业务后无法返回');
    } else {
      result.checks.navigation = 'not-applicable';
    }
    result.checks.reading=[];result.checks.sources=[];
    for(const checked of result.views){
      const view=businesses.get(checked.key);navigate(checked.key);await pause();
      const cases=scenarios(view.flow),failures=[],advisories=[];
      for(const values of cases.values){
        const plan=readingPlan(view.flow,values);
        if(plan.blocked.length)failures.push({values,blocked:plan.blocked,conflicts:plan.conflicts});
        if(plan.conflicts.length)advisories.push({values,objects:plan.conflicts,detail:'输入可能绕过未选条件；核对是否是独立入口或需要 when，不自动改写'});
      }
      result.checks.reading.push({view:checked.key,checked:cases.values.length,total:cases.total,complete:cases.complete,failures,advisories});
      for(const failure of failures)result.failures.push(`${view.title}：阅读依赖受阻 ${JSON.stringify(failure)}`);
      let tested=0;
      for(const [kind,items] of [['object',view.flow.objects],['relation',view.flow.relations]])for(const item of items){
        if(!item.sources)continue;
        if(kind==='object')select(item);else selectRelation(item);
        document.querySelector('#show-source').click();
        const expected=[...new Set([item.sources].flat())];
        const found=[...document.querySelectorAll('#sources [data-ref]')].map(n=>n.dataset.ref);
        const passed=!document.querySelector('#drawer').hidden&&expected.every(ref=>found.includes(ref));
        if(!passed)result.failures.push(`${view.title}/${item.id}：源码点击未显示声明引用`);
        closeSource();tested++;
      }
      result.checks.sources.push({view:checked.key,tested,status:tested?'tested':'no-declared-source'});
      await pause();
      const panelWarnings=geometryWarnings(currentDiagram,view.flow).filter(w=>!w.info);
      result.geometry.diagnostics.push(...panelWarnings.map(w=>({view:checked.key,context:'details-open',...w})));
      result.geometry.warnings.push(...panelWarnings.map(w=>`${view.title}（详情打开）：${w.code} ${w.detail} ${w.ids.join('/')}`));
    }
    navigate(started);
    result.timingsMs.interactions=round(performance.now()-clock-result.timingsMs.geometry);
    result.status = result.failures.length ? 'failed' : 'passed';
    result.geometry.status = result.geometry.warnings.length ? 'warnings' : 'passed';
    return result;
  }

  window.litflux = {
    startEntryAudit(options={}) {
      if (job?.status==='running') return 'running';
      job = { status: 'running' };
      run(options).then(
        (result) => { job = result; },
        (error) => { job = { status: 'failed', failures: [String(error.message || error)], geometry: { warnings: [] } }; },
      );
      return 'running';
    },
    entryAuditStatus() {
      return JSON.stringify({ status: job ? job.status : 'idle' });
    },
    entryAuditResult() {
      return JSON.stringify(job || { status: 'idle' });
    },
    geometry() {
      return JSON.stringify(currentDiagram?.geometry || null);
    },
  };
})();
</script>
<script>const semanticLocalizer=((root, state, messages) => {
  const source = new WeakMap();
  const attributes = ['title', 'label', 'aria-label', 'aria-valuetext', 'placeholder', 'data-tooltip', 'data-description'];
  let scheduled = false;
  const dictionary = {...messages};
  const parts = Object.keys(dictionary).filter(key => key.length > 1 && /[\u3400-\u9fff]/.test(key)).sort((a,b) => b.length-a.length);
  const pattern = new RegExp(parts.map(key => key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|'), 'g');
  function text(value) {
    const raw = String(value ?? '');
    if (state.language !== 'en') return raw;
    if (Object.hasOwn(dictionary, raw)) return dictionary[raw];
    if (!/[\u3400-\u9fff，；。、「」：]/.test(raw)) return raw;
    // Match reviewed phrases only. Source identifiers, paths and code are never translated.
    const translated = raw.replace(pattern, match => dictionary[match]);
    return /[\u3400-\u9fff]/.test(translated) ? raw : translated.replace(/[，；。、「」：]/g, mark => ({'，':', ','；':'; ','。':'.','、':', ','「':'"','」':'"','：':': '}[mark]));
  }
  function update(node, key, value, write) {
    let record = source.get(node);
    if (!record) { record = {}; source.set(node, record); }
    const old = record[key];
    const raw = old && old.output === value ? old.raw : value;
    const output = text(raw);
    record[key] = {raw, output};
    if (output !== value) write(output);
  }
  function apply() {
    observer.disconnect();
    try {
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT, {
        acceptNode(node) {
          const el = node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement;
          return el.closest('script,style,pre,code,[data-no-translate],.sf-signature') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT;
        }
      });
      while (walker.nextNode()) {
        const node = walker.currentNode;
        if (node.nodeType === Node.TEXT_NODE) update(node, 'text', node.nodeValue, value => {node.nodeValue = value;});
        else for (const name of attributes) if (node.hasAttribute(name)) update(node, name, node.getAttribute(name), value => node.setAttribute(name, value));
      }
      root.lang = state.language === 'zh' ? 'zh-CN' : 'en';
      document.documentElement.lang = root.lang;
    } finally { observer.observe(root, {subtree:true, childList:true, characterData:true, attributes:true, attributeFilter:attributes}); }
  }
  const observer = new MutationObserver(() => {
    if (scheduled) return;
    scheduled = true;
    queueMicrotask(() => {scheduled = false; apply();});
  });
  return {text, apply};
}
