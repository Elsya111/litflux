<!doctype html><html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LitFlux</title><style>__VIEWER_CSS__</style></head>
<body id="litflux-canvas-app">
<div class="app">
  <header class="app-header" id="app-header">
    <div class="identity"><div class="brand">LitFlux</div><div class="project-heading"><div><span id="title" class="project-name"></span><span id="delivery-badge" class="badge">草稿</span></div><div class="project-kicker">从业务流程读懂代码</div></div></div>
    <div class="workflow-picker"><label for="workflow-select">工作流</label><select id="workflow-select" aria-describedby="workflow-trigger"></select><p id="workflow-trigger" class="workflow-trigger" data-no-translate></p></div>
    <button id="theme" class="toolbar-button">深色主题</button>
    <button id="collapse-header" class="icon-button" aria-label="收起顶栏" title="收起顶栏" aria-expanded="true" aria-controls="app-header">⌃</button>
  </header>
  <div class="dual-layout inspector-open">
    <aside id="business-panel" class="business-panel"><div class="panel-head"><h2>业务分解图</h2><div class="branch-tools"><button id="collapse-all">收拢</button><button id="expand-all">展开</button></div></div><p class="business-caption">组成与层级 · 点击业务进入</p><div id="business" class="business-canvas" aria-label="业务分解图"></div><details class="project-info"><summary>项目信息</summary><h2 id="project-title"></h2><p id="summary"></p><p id="scope"></p></details><button id="collapse-business" class="edge-toggle edge-toggle-right" aria-label="收起业务分解图" aria-controls="business-panel">‹</button></aside>
    <main class="workspace">
      <nav id="crumbs" class="crumbs" aria-label="当前业务路径"></nav>
      <div class="workspace-bar">
        <button id="back-level" class="toolbar-button back-level" hidden aria-label="返回上一层">← 返回上层</button>

        <div class="bar-actions"><button id="read-start" class="primary">开始阅读</button><button id="read-next" class="primary" hidden disabled>下一步</button><button id="read-reset" hidden>退出阅读</button>
          <div class="zoom-tools" role="group" aria-label="缩放"><button id="zoom-out" aria-label="缩小">−</button><output id="zoom-value" aria-label="当前比例">100%</output><button id="zoom-in" aria-label="放大">+</button></div>
          <button id="fit" class="toolbar-button">适应全图</button><button id="reset-view" class="toolbar-button">原始大小</button><button id="toggle-details" class="panel-toggle" aria-expanded="true" aria-controls="inspector">节点详情</button>
        </div>
      </div>

        <div class="graph-note"><span class="key" data-legend="data">数据实线：即时承接</span><span class="key later" data-legend="data">数据虚线：保留后用</span><span class="key control" data-legend="control">◇ 控制与条件</span><span data-legend="failure">╌ 失败路径</span><span data-legend="loop">↺ 循环回指</span><span data-legend="effect">→ 资源作用</span><span data-legend="capability">⋯ 组件能力</span><span>悬浮预览 · 点击查看详情 · 拖拽平移</span></div>

        <div class="details-actions"><button id="expand" class="primary" hidden>进入内部</button><button id="show-source" class="toolbar-button" hidden>查看源码</button></div>
        <section id="branch-section" class="detail-section" hidden><h3>分支</h3><div id="branch-choices" class="branch-choices"></div><p class="branch-hint">点击图上的判断节点可切换到下一个分支。</p></section>
        <section id="source-links-section" class="detail-section" hidden><h3>源码位置</h3><div id="source-links" class="source-links"></div></section>
        <section id="connections-section" class="detail-section" hidden><h3>关联对象</h3><div id="connections" class="connected-list"></div></section>

      <button id="close-details" class="edge-toggle edge-toggle-left" aria-label="收起节点详情" aria-controls="inspector">›</button>

  <div class="edge-hint edge-top" id="edge-top" hidden><button id="expand-header" aria-label="展开顶栏">⌄ 顶栏</button></div>
  <div class="edge-hint edge-left" id="edge-left" hidden><button id="expand-business" aria-label="展开业务分解图">业务分解图 ›</button></div>
  <div class="edge-hint edge-right" id="edge-right" hidden><button id="expand-details" aria-label="展开节点详情">‹ 节点详情</button></div>
</div>
<div id="node-preview" class="node-preview" role="tooltip" hidden></div>
<script>__DRAWING__</script>
<script id="module" type="text/plain">__MODULE__</script>
<script id="payload" type="application/json">__PAYLOAD__</script>
<script>
const payload=JSON.parse(document.querySelector('#payload').textContent);
const moduleRecord={exports:{}};
new Function('module','exports',document.querySelector('#module').textContent)(moduleRecord,moduleRecord.exports);
const model=moduleRecord.exports;
const $=s=>document.querySelector(s);
const html=(tag,value)=>{const e=document.createElement(tag);if(value!==undefined)e.textContent=value;return e;};
const svg=(tag,attrs={})=>LitFluxDrawing.el(tag,attrs);

const businesses=new Map();
function index(flow,key,title,parent,owner){
  businesses.set(key,{key,title,flow,parent:parent||null,owner:owner||null});
  for(const object of flow.objects){
    if(object.type!=='business')continue;
    const child=key+'/'+object.id;
    if(object.detail)index(object.detail,child,object.title,key,object);
    else businesses.set(child,{key:child,title:object.title,flow:null,parent:key,owner:object});
  }
}
for(const workflow of model.workflows)index(workflow.flow,'workflow:'+workflow.id,workflow.title);

const collapsed=new Set(), viewChoices=new Map(), viewMemory=new Map();
let current='workflow:'+model.workflows[0].id, selected=null, reading=null, currentDiagram=null;
let zoom=1, pan={x:0,y:0}, sourceRefs=[], returnFocus=null, motionEnabled=true;
let pendingAnchor=null, inspectorReturnFocus=null, previewTimer=0, previewCloseTimer=0, previewAnchor=null, previewFocused=false;
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
const roleNames={business:'业务',data:'数据',resource:'资源',component:'组件',decision:'判断',boundary:'边界',relation:'关系'};
const relationNames={data:'数据依赖',control:'控制与条件',failure:'失败路径',loop:'循环回指',effect:'资源作用',capability:'组件能力'};
const objectRole=o=>o.type==='resource'?'资源 · '+LitFluxDrawing.resourceKinds[LitFluxDrawing.resourceKind(o.resourceKind)]:roleNames[o.type]||o.type;
const refsOf=refs=>[...new Set(refs==null?[]:Array.isArray(refs)?refs:[refs])];
const sourceLabel=ref=>{const s=payload.sources[ref];return s?s.path+':'+s.start+(s.end===s.start?'':'–'+s.end):ref;};
const objectTitle=id=>flow().objects.find(o=>o.id===id)?.title||id;

function cameraAnchor(){
  const group=selected?.kind==='relation'?currentDiagram?.drawn?.get(selected.relation.id)?.group:currentDiagram?.positions?.get(selected?.object?.id)?.group;
  if(!group)return null;
  const box=group.getBoundingClientRect();
  return {key:current,id:selected.kind==='relation'?selected.relation.id:selected.object.id,relation:selected.kind==='relation',x:box.x+box.width/2,y:box.y+box.height/2,focused:document.activeElement===group};
}
function schedulePlot(){cancelAnimationFrame(frame);frame=requestAnimationFrame(()=>{plot();restoreCamera();paintReading();});}
function preserveCamera(change){pendingAnchor=cameraAnchor();hidePreview();change();schedulePlot();}
function restoreCamera(){
  const a=pendingAnchor;pendingAnchor=null;if(!a||a.key!==current)return;
  const group=a.relation?currentDiagram?.drawn?.get(a.id)?.group:currentDiagram?.positions?.get(a.id)?.group;
  if(!group)return;
  const b=group.getBoundingClientRect(),host=$('#canvas').getBoundingClientRect();
  let left=host.left,right=host.right;
  for(const [selector,side] of [['#business-panel','left'],['#inspector','right']]){const panel=$(selector);if(!panel.hidden&&getComputedStyle(panel).position==='absolute'){const r=panel.getBoundingClientRect();if(side==='left')left=Math.max(left,r.right+12);else right=Math.min(right,r.left-12);}}
  const padX=Math.min(80,b.width/2+12),padY=Math.min(60,b.height/2+12);
  const x=right-left>padX*2?Math.max(left+padX,Math.min(a.x,right-padX)):host.left+host.width/2;
  const y=Math.max(host.top+padY,Math.min(a.y,host.bottom-padY));
  pan.x+=x-b.x-b.width/2;pan.y+=y-b.y-b.height/2;scale();
  if(a.focused&&document.activeElement===document.body){group.focus({preventScroll:true});hidePreview();}
}
function setInspector(open){
  if($('#inspector').hidden===!open)return;
  if(open)inspectorReturnFocus=document.activeElement;
  preserveCamera(()=>{$('#inspector').hidden=!open;$('.dual-layout').classList.toggle('inspector-open',open);$('#toggle-details').setAttribute('aria-expanded',String(open));syncChrome();});
  if(!open){setSourceFull(false);sourceRefs=[];$('#drawer').hidden=true;$('#details-body').hidden=false;
    const target=inspectorReturnFocus?.isConnected&&!$('#inspector').contains(inspectorReturnFocus)?inspectorReturnFocus:$('#toggle-details');target.focus();}
}
function setHeader(open){
  const app=$('.app');
  if(!app||app.classList.contains('header-collapsed')===!open)return;
  preserveCamera(()=>{app.classList.toggle('header-collapsed',!open);$('#collapse-header').setAttribute('aria-expanded',String(open));syncChrome();});
  if(!open)$('#expand-header').focus({preventScroll:true});
}
function setBusiness(open){
  if($('#business-panel').hidden===!open)return;
  preserveCamera(()=>{$('#business-panel').hidden=!open;$('.dual-layout').classList.toggle('sidebar-collapsed',!open);$('#collapse-business').setAttribute('aria-expanded',String(open));syncChrome();});
  if(!open)$('#expand-business').focus({preventScroll:true});
}
function syncChrome(){
  $('#edge-top').hidden=!$('.app').classList.contains('header-collapsed');
  $('#edge-left').hidden=!$('.dual-layout').classList.contains('sidebar-collapsed');
  $('#edge-right').hidden=!$('#inspector').hidden;
}
function chooseBranch(object,choiceId){
  const values=choices();
  if(!Object.hasOwn(values,object.id)||values[object.id]===choiceId)return;
  values[object.id]=choiceId;reading=null;renderChoices();plot();paintReading();
}
function cycleBranch(object){
  const values=choices();
  if(!Object.hasOwn(values,object.id))return false;
  const list=object.choices,i=Math.max(0,list.findIndex(c=>c.id===values[object.id]));
  values[object.id]=list[(i+1)%list.length].id;reading=null;renderChoices();plot();paintReading();
  return true;
}
function handleObject(object,enter=false){
  if(enter&&object.detail){navigate(current+'/'+object.id);return;}
  cycleBranch(object);
  showDetails({kind:'object',object});
}
function previewText(text){
  const paragraph=String(text||'').trim().split(/\n\s*\n|\n/)[0];
  const first=paragraph.match(/^.*?[。！？]|^.*?[.!?](?=\s|$)/)?.[0]||paragraph;
  return first.length>200?first.slice(0,200)+'…':first;
}
function hidePreview(){
  clearTimeout(previewTimer);clearTimeout(previewCloseTimer);$('#node-preview').hidden=true;
  previewAnchor?.removeAttribute('aria-describedby');previewAnchor=null;previewFocused=false;
}
function endPreview(){clearTimeout(previewTimer);previewCloseTimer=setTimeout(hidePreview,160);}
function startPreview(object,anchor,focused=false){
  hidePreview();previewAnchor=anchor;previewFocused=focused;
  previewTimer=setTimeout(()=>{
    if(!anchor.isConnected)return;
    const preview=$('#node-preview');preview.replaceChildren();
    const role=html('span',objectRole(object));role.className='role';preview.append(role,html('strong',object.title));
    if(object.text)preview.append(html('p',previewText(object.text)));
    const refs=refsOf(object.sources);
    if(refs.length){const source=html('p',sourceLabel(refs[0])+(refs.length>1?' +'+(refs.length-1):''));source.className='preview-source';source.dataset.noTranslate='';preview.append(source);}
    const hint=html('p','点击或按 Enter 查看完整详情');hint.className='preview-hint';preview.append(hint);
    preview.hidden=false;anchor.setAttribute('aria-describedby','node-preview');
    const a=anchor.getBoundingClientRect(),b=preview.getBoundingClientRect();
    let x=a.right+12;if(x+b.width>innerWidth-12)x=a.left-b.width-12;
    preview.style.left=Math.max(12,Math.min(x,innerWidth-b.width-12))+'px';
    preview.style.top=Math.max(12,Math.min(a.top,innerHeight-b.height-12))+'px';
  },250);
}

const flow=()=>businesses.get(current).flow;
function navigate(key){
  const target=businesses.get(key);
  if(!target)return;
  hidePreview();pendingAnchor=null;setSourceFull(false);sourceRefs=[];$('#drawer').hidden=true;$('#details-body').hidden=false;
  for(let b=target;b.parent;b=businesses.get(b.parent))collapsed.delete(b.parent);
  if(!target.flow){if(current!==target.parent)navigate(target.parent);select(target.owner);return;}
  if(current===key){businessPlot();return;}
  viewMemory.set(current,{selected,reading,zoom,pan:{...pan},left:$('#canvas').scrollLeft,top:$('#canvas').scrollTop});
  current=key;const saved=viewMemory.get(key);
  selected=saved?.selected||null;reading=saved?.reading||null;
  zoom=saved?.zoom||1;pan=saved?.pan||{x:0,y:0};
  render();
  $('#canvas').scrollTo(saved?.left||0,saved?.top||0);
}
function choices(){
  if(!viewChoices.has(current))viewChoices.set(current,Object.fromEntries(flow().objects.filter(o=>o.choices).map(o=>[o.id,o.choices[0].id])));
  return viewChoices.get(current);
}
function whenMatches(when,values){
  if(!when)return true;
  if(Array.isArray(when))return when.some(item=>whenMatches(item,values));
  return Object.entries(when).every(([id,value])=>values[id]===value);
}
function allowed(relation,values){
  return whenMatches(relation.when,values)&&(!relation.branch||values[relation.from]===relation.branch);
}
function activeSet(flow,values){
  const structural=flow.relations.filter(r=>['data','control','failure'].includes(r.type));
  const forward=structural.filter(r=>allowed(r,values));
  const incoming=new Map(flow.objects.map(o=>[o.id,0]));
  for(const r of structural)if(incoming.has(r.to))incoming.set(r.to,incoming.get(r.to)+1);
  // Roots come from the declared graph, not from the filtered one: a node whose only
  // entrance sits on an unchosen branch is not an entrance.
  const roots=flow.objects.filter(o=>incoming.get(o.id)===0).map(o=>o.id);
  const structuralReach=new Set(),pending=[...roots];
  while(pending.length){const id=pending.pop();if(structuralReach.has(id))continue;structuralReach.add(id);for(const r of structural)if(r.from===id)pending.push(r.to);}
  // Rootless components must participate in dependency checks, not disappear as zero work.
  roots.push(...flow.objects.filter(o=>!structuralReach.has(o.id)).map(o=>o.id));
  const seen=new Set(),queue=[...roots];
  while(queue.length){
    const id=queue.pop();
    if(seen.has(id))continue;
    seen.add(id);
    for(const r of forward)if(r.from===id)queue.push(r.to);
  }
  for(const r of flow.relations)if(['effect','capability'].includes(r.type)&&seen.has(r.from)&&flow.objects.some(o=>o.id===r.to&&['resource','component'].includes(o.type)))seen.add(r.to);
  return seen;
}
function readingPlan(flow,values){
  const active=activeSet(flow,values);
  const steps=flow.objects.filter(o=>active.has(o.id)&&!['resource','component'].includes(o.type)&&o.type!=='boundary');
  const forward=flow.relations.filter(r=>['data','control','failure'].includes(r.type)&&allowed(r,values));
  const dependencies=Object.fromEntries(steps.map(o=>[o.id,[...new Set(forward.filter(r=>r.to===o.id).map(r=>r.from))].filter(id=>steps.some(s=>s.id===id))]));
  const preferred=flow.reading||[];
  const rank=id=>{const index=preferred.indexOf(id);return index<0?preferred.length+steps.findIndex(s=>s.id===id):index;};
  const done=new Set(),order=[];
  while(order.length<steps.length){
    const ready=steps.filter(o=>!done.has(o.id)&&dependencies[o.id].every(id=>done.has(id))).sort((a,b)=>rank(a.id)-rank(b.id));
    if(!ready.length)break;
    const last=order.at(-1);
    const immediate=ready.find(o=>forward.some(r=>r.type==='data'&&r.timing==='immediate'&&r.from===last&&r.to===o.id));
    const pick=immediate||ready[0];
    order.push(pick.id);done.add(pick.id);
  }
  const conflicts=steps.filter(o=>{
    const branches=flow.relations.filter(r=>r.to===o.id&&r.branch&&active.has(r.from));
    if(!branches.length||branches.some(r=>allowed(r,values)))return false;
    const queue=branches.map(r=>r.from),seen=new Set();
    while(queue.length){const id=queue.pop();if(id===o.id)return false;if(seen.has(id))continue;seen.add(id);for(const r of forward)if(r.from===id&&active.has(r.to))queue.push(r.to);}
    return true;
  }).map(o=>o.id);
  // Include boundary/resource vertices in cycle detection even though they are not reading steps.
  const degree=new Map([...active].map(id=>[id,0]));
  for(const r of forward)if(active.has(r.from)&&active.has(r.to))degree.set(r.to,degree.get(r.to)+1);
  const queue=[...degree].filter(([,n])=>!n).map(([id])=>id),visited=new Set();
  while(queue.length){const id=queue.pop();visited.add(id);for(const r of forward)if(r.from===id&&degree.has(r.to)){degree.set(r.to,degree.get(r.to)-1);if(!degree.get(r.to))queue.push(r.to);}}
  const cyclic=[...active].filter(id=>!visited.has(id));
  return {order,blocked:[...new Set([...steps.filter(o=>!done.has(o.id)).map(o=>o.id),...cyclic])],active,conflicts};
}
function paintReading(){
  const plan=reading?.plan, done=new Set(reading?plan.order.slice(0,reading.cursor):[]), last=reading?.plan.order[reading.cursor-1];
  const active=plan?plan.active:activeSet(flow(),choices());
  for(const [id,record] of currentDiagram?.positions||[]){
    record.group.classList.toggle('is-selected',selected?.kind!=='relation'&&selected?.object?.id===id);
    record.group.classList.toggle('is-current',id===last);
    record.group.classList.toggle('is-done',done.has(id));
    record.group.classList.toggle('is-dim',!active.has(id));
  }
  for(const [id,record] of currentDiagram?.drawn||[]){
    record.group.classList.toggle('is-selected',selected?.kind==='relation'&&selected.relation.id===id);
    const inactive=!allowed(record.relation,choices())||!active.has(record.relation.from)||!active.has(record.relation.to);
    record.line.classList.toggle('is-dim',inactive);
    record.group.classList.toggle('is-dim',inactive);
    const focus=selected?.kind==='relation'?null:selected?.object?.id;
    record.line.classList.toggle('related',selected?.kind==='relation'?selected.relation.id===id:!!focus&&(record.relation.from===focus||record.relation.to===focus));
  }
  const completed=reading&&reading.cursor===reading.plan.order.length;
  $('#read-start').hidden=!!reading;
  $('#read-next').hidden=!reading||completed;
  $('#read-next').disabled=!reading||completed;
  $('#read-reset').hidden=!reading;
  $('#read-status').hidden=!reading;
  $('#read-status').textContent=!reading?'':plan.blocked.length?'阅读受阻：'+plan.blocked.join('、'):completed?'本层阅读完成；不是程序执行成功。':`${reading.cursor}/${plan.order.length} · 按作者声明的关系阅读`;
  if(reading&&plan.conflicts.length)$('#read-status').textContent+=' · 输入可能绕过未选条件：'+plan.conflicts.join('、');
  syncFlow();
}
function renderChoices(){
  const values=choices();
  const host=$('#choices');
  if(!host)return;
  host.replaceChildren();
  const owners=flow().objects.filter(o=>o.choices);
  for(const object of owners){
    const label=html('label',object.title), select=html('select');
    select.dataset.choice=object.id;
    for(const choice of object.choices){const option=html('option',choice.label);option.value=choice.id;select.append(option);}
    select.value=values[object.id];
    select.onchange=()=>{values[object.id]=select.value;reading=null;renderChoices();plot();paintReading();};
    label.append(select);
    host.append(label);
  }
}
function showDetails(target,reveal=true){
  hidePreview();selected=target;sourceRefs=[];$('#drawer').hidden=true;$('#details-body').hidden=false;
  let refs=[],title='';$('#selected-symbol').replaceChildren();
  $('#branch-section').hidden=true;
  if(target.kind==='relation'){
    const relation=target.relation;
    title=relation.label||objectTitle(relation.from)+' → '+objectTitle(relation.to);
    $('#selected-role').textContent='关系 · '+relationNames[relation.type];
    const note=relation.timingNote?`\n判断依据：${relation.timingNote}`:'';
    $('#selected-text').textContent=objectTitle(relation.from)+' → '+objectTitle(relation.to)+(relation.type==='data'?'\n'+(relation.timing==='immediate'?'即时承接':'保留后用'):'')+note;
    refs=refsOf(relation.sources);$('#selected-symbol').textContent='→';
    $('#expand').hidden=true;
  }else{
    const object=target.object;
    title=object.title;
    $('#selected-role').textContent=objectRole(object);
    $('#selected-text').textContent=object.text||'';
    refs=refsOf(object.sources);
    if(object.type==='resource')$('#selected-symbol').append(LitFluxDrawing.resourceIcon(object.resourceKind));
    else $('#selected-symbol').append(LitFluxDrawing.roleIcon(object.type));
    if(object.choices){
      const values=choices();
      $('#branch-section').hidden=false;
      $('#branch-choices').replaceChildren();
      for(const choice of object.choices){
        const button=html('button',choice.label);
        button.className='branch-chip';
        button.setAttribute('aria-pressed',String(values[object.id]===choice.id));
        button.onclick=()=>{chooseBranch(object,choice.id);showDetails(target);};
        $('#branch-choices').append(button);
      }
    }
    $('#expand').hidden=!object.detail;
    $('#expand').onclick=()=>navigate(current+'/'+object.id);
  }
  $('#selected-title').textContent=title;

  $('#show-source').hidden=!refs.length;$('#show-source').onclick=()=>openSource(refs,title);

  for(const ref of refs){const button=html('button',sourceLabel(ref));button.dataset.noTranslate='';button.onclick=()=>openSource([ref],title);$('#source-links').append(button);}
  $('#connections').replaceChildren();const related=new Map();
  const add=(id,direction)=>{if(!related.has(id))related.set(id,direction);};
  if(target.kind==='relation'){add(target.relation.from,'来自');add(target.relation.to,'指向');}
  else for(const r of flow().relations){if(r.to===target.object.id)add(r.from,'来自');if(r.from===target.object.id)add(r.to,'指向');}
  $('#connections-section').hidden=!related.size;
  for(const [id,direction] of related){const button=html('button');button.append(html('span',direction),html('strong',objectTitle(id)));button.onclick=()=>select(flow().objects.find(o=>o.id===id));$('#connections').append(button);}
  relationIndex();
  if(reveal){const alreadyOpen=!$('#inspector').hidden;setInspector(true);if(alreadyOpen){pendingAnchor=cameraAnchor();schedulePlot();}}

function select(object,enter=false){if(enter&&object.detail){navigate(current+'/'+object.id);return;}showDetails({kind:'object',object});}
function selectRelation(relation){showDetails({kind:'relation',relation});}
function relationIndex(){

  $('#relation-index-title').textContent='相关关系 · '+relations.length;$('#relation-index').hidden=!relations.length;
  $('#relation-list').replaceChildren();

    const item=html('li'),button=html('button');
    const pair=html('span',objectTitle(relation.from)+' → '+objectTitle(relation.to));pair.className='pair';

function businessPlot(){
  const host=$('#business'), root=current.split('/')[0];
  const visible=[...businesses.values()].filter(b=>b.key===root||b.key.startsWith(root+'/'));
  const children=new Map(visible.map(b=>[b.key,[]]));
  for(const b of visible)children.get(b.parent)?.push(b);
  const shown=visible.filter(b=>{for(let p=b.parent;p;p=businesses.get(p)?.parent)if(collapsed.has(p))return false;return true;});
  const width=Math.max(220,host.clientWidth-20);
  const maxDepth=Math.max(1,...shown.map(b=>b.key.split('/').length-1));
  const indent=Math.min(16,(width-170)/maxDepth);
  const positions=new Map();let cursor=8;
  for(const b of shown){
    const depth=b.key.split('/').length-1, left=18+depth*indent, w=width-left-4;
    const rows=LitFluxDrawing.wrap(b.title,w-44,12), height=Math.max(40,rows.height+20);
    positions.set(b.key,{left,w,y:cursor+height/2,height,rows});cursor+=height+10;
  }
  const out=svg('svg',{width,height:cursor+4,role:'group','aria-label':'业务分解图'});
  for(const b of shown){
    const p=positions.get(b.key),a=positions.get(b.parent);
    if(a){
      const active=current===b.key||current.startsWith(b.key+'/');
      out.append(svg('path',{class:'business-connector'+(active?' active':''),d:`M${a.left+8} ${a.y+a.height/2} V${p.y-5} Q${a.left+8} ${p.y} ${a.left+13} ${p.y} H${p.left}`}));
    }
  }
  const activate=(g,action)=>{g.onclick=action;g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();action();}};};
  for(const b of shown){
    const p=positions.get(b.key),count=children.get(b.key).length;
    const g=svg('g',{class:'business-node'+(b.key===current?' current':'')+(selected?.object===b.owner&&b.owner?' selected':''),transform:`translate(${p.left},${p.y})`,tabindex:0,role:'button','aria-label':b.title,'data-business':b.key});
    if(b.key===current)g.setAttribute('aria-current','location');
    g.append(svg('rect',{class:'business-card',x:0,y:-p.height/2,width:p.w,height:p.height,rx:7}));
    const t=svg('text',{class:'business-label',y:-(p.rows.height-p.rows.lineHeight)/2+4});
    p.rows.lines.forEach((row,i)=>{const span=svg('tspan',{x:12,dy:i?p.rows.lineHeight:0});span.textContent=row;t.append(span);});
    g.append(t);
    if(count){const label=svg('text',{class:'business-count',x:p.w-12,y:4,'text-anchor':'end'});label.textContent=count;g.append(label);}
    activate(g,()=>navigate(b.key));out.append(g);
    if(count){
      const toggle=svg('g',{class:'business-toggle',transform:`translate(${p.left-9},${p.y})`,tabindex:0,role:'button','aria-label':(collapsed.has(b.key)?'展开':'收拢')+b.title,'aria-expanded':String(!collapsed.has(b.key)),'data-toggle':b.key});
      toggle.append(svg('rect',{class:'toggle-hit',x:-9,y:-10,width:18,height:20,rx:5}),svg('path',{class:'toggle-chevron',d:collapsed.has(b.key)?'M-2 -4 L2 0 L-2 4':'M-4 -2 L0 2 L4 -2'}));
      activate(toggle,()=>{
        if(collapsed.has(b.key))collapsed.delete(b.key);else collapsed.add(b.key);
        businessPlot();
        [...host.querySelectorAll('[data-toggle]')].find(n=>n.dataset.toggle===b.key)?.focus();
      });out.append(toggle);
    }
  }
  host.replaceChildren(out);
}
function scale(){
  hidePreview();$('#zoom-value').textContent=Math.round(zoom*100)+'%';
  if(!currentDiagram?.svg)return;
  const s=currentDiagram.svg;
  s.style.width=currentDiagram.width*zoom+'px';
  s.style.height=currentDiagram.height*zoom+'px';
  s.style.marginLeft=Math.max(0,($('#canvas').clientWidth-currentDiagram.width*zoom)/2)+'px';
  s.style.transform=`translate(${pan.x}px,${pan.y}px)`;
}
function plot(){
  hidePreview();
  const host=$('#canvas');
  try{
    const view=flow();
    const scene=LitFluxDrawing.create(view,host,{onObject:handleObject,onRelation:selectRelation,onPreview:startPreview,onPreviewEnd:endPreview});
    view.draw(scene,{width:host.clientWidth,height:host.clientHeight});
    currentDiagram=scene.finish();
    currentDiagram.error=null;
    scale();
  }catch(error){
    currentDiagram={error:String(error.message||error)};
    const box=html('p','绘图错误：'+currentDiagram.error);box.className='drawing-error';
    host.replaceChildren(box);
  }
}
function syncFlow(){
  const out=currentDiagram?.svg;
  if(!out)return;
  out.querySelectorAll('.flow-particles').forEach(n=>n.remove());
  if(!motionEnabled||reducedMotion.matches)return;
  const focus=selected?.kind==='relation'?null:selected?.object?.id;
  if(!focus)return;
  const active=activeSet(flow(),choices());
  const layer=svg('g',{class:'flow-particles','aria-hidden':'true'});
  for(const [id,record] of currentDiagram.drawn){
    const relation=record.relation;
    if(relation.type!=='data'||(relation.from!==focus&&relation.to!==focus))continue;
    if(!allowed(relation,choices())||!active.has(relation.from)||!active.has(relation.to))continue;
    const path=record.line;
    path.id='flow-'+id;
    const duration=Math.max(1.5,Math.min(4,path.getTotalLength()/110));
    for(let i=0;i<2;i++){
      const dot=svg('circle',{r:i?2.5:3,class:'flow-dot','data-direction':relation.to===focus?'input':'output'});
      const motion=svg('animateMotion',{dur:duration+'s',begin:-(i*duration/2)+'s',repeatCount:'indefinite',calcMode:'paced'});
      motion.append(svg('mpath',{href:'#'+path.id}));
      dot.append(motion);layer.append(dot);
    }
  }
  out.querySelector('g').append(layer);
}
function openSource(refs,title){

    const section=html('section'),pre=html('pre');
    section.className='source';section.dataset.ref=ref;section.dataset.noTranslate='';
    section.append(html('h3',source.path+':'+source.start+'–'+source.end));
    source.lines.forEach((value,i)=>{
      const row=html('span'),ln=html('span',String(source.start+i));
      row.className='row';ln.className='ln';row.append(ln,html('span',value));pre.append(row);

function applyTheme(theme,persist=false){
